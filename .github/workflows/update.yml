# 유동성 데이터 자동 갱신.
#
# 평일마다 update.py를 실행해 data/latest.json · data/history.json을 다시 만들고,
# 바뀐 게 있으면 저장소에 커밋한다. GitHub Pages 대시보드는 이 두 파일만 읽는다.
#
# 스케줄: 평일 22:00 UTC (한국 시간 다음날 07:00).
#   - 목요일: H.4.1(WALCL/WTREGEN/WRESBAL 등 주간 시리즈)이 ~21:30 UTC에 나오므로
#     그 직후를 잡는다.
#   - 나머지 평일: RRP/SOFR/SRF 같은 일간 압력 지표가 매일 바뀌므로 같이 갱신한다.
#     목요일에만 돌리면 분기말 레포 스파이크를 최대 일주일 늦게 보게 된다.
#   GitHub의 예약 실행은 부하에 따라 수십 분 늦어질 수 있다.
#
# Actions 탭의 "Run workflow" 버튼(workflow_dispatch)으로 수동 실행도 가능하다.

name: Update liquidity data

on:
  schedule:
    - cron: "0 22 * * 1-5"
  workflow_dispatch:

# 봇이 latest.json/history.json을 커밋·push하려면 쓰기 권한이 필요하다.
permissions:
  contents: write

# 수동 실행과 예약 실행이 겹치면 push가 충돌하므로 한 번에 하나만 돈다.
concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 저장소 받기
        uses: actions/checkout@v7

      - name: 파이썬 3.12 설치
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: 의존성 설치
        run: pip install -r requirements.txt

      # 필수 시리즈(WALCL/WTREGEN/RRPONTSYD)를 못 받으면 exit 1 →
      # 이 단계에서 워크플로가 실패로 끝나고 커밋은 하지 않는다.
      - name: 데이터 수집 + 판정
        run: python update.py

      - name: 변경분 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/history.json
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
            exit 0
          fi
          as_of=$(python -c "import json; print(json.load(open('data/latest.json'))['as_of_date'])")
          git commit -m "data: ${as_of} 기준 갱신"
          git push
